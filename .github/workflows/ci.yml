name: CI

# AC8 (Story W0). These triggers used to be `push: [main, dev]` and
# `pull_request: [main]` only, which meant a PR into `book-scale/integration` —
# the branch every Track W/V story merges into — ran NO CI AT ALL. Not "ran and
# passed": ran nothing, reported nothing, and merged green because there was no
# check to be red. The book-scale branches are added explicitly rather than left
# implicit; when the effort lands on main and the integration branch is deleted,
# delete these two lines with it.
on:
  push:
    branches: [main, dev, 'book-scale/**']
  pull_request:
    branches: [main, dev, 'book-scale/integration', 'dev4-demo']

jobs:
  api:
    name: API — lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      # GATING. Was `... -x -q`; `-x` stopped at the first failure, so CI never
      # enumerated its own damage. These two directories are green today and must
      # stay green.
      # `-m "not postgres"`: the postgres-marked suite replays supabase/migrations/
      # against a real container. It must not sit on the gating path, where an
      # anonymous Docker Hub pull failure or rate-limit would turn main red for a
      # reason unrelated to the change under test. It runs as its own job below.
      - name: Unit tests (gating)
        run: pytest tests/unit tests/integration -q -m "not postgres"
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
          SUPABASE_JWT_SECRET: test-secret-at-least-32-chars-long!!
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: test
          ELEVENLABS_API_KEY: test
          HEYGEN_API_KEY: test
          LANGFUSE_PUBLIC_KEY: test
          LANGFUSE_SECRET_KEY: test

      # ADVISORY — see docs/DEFECT-REGISTER.md D24.
      # D/P1: the gating command above skips the root tests/ directory entirely.
      # 22 real failures live there and have never once been run by CI. This step
      # runs them so the number is visible, but does NOT gate: making it gate today
      # would turn main red for all four developers over failures none of this PR
      # introduced. Trigger to drop `continue-on-error` and fold this into the
      # gating step: the 22 reach zero (Dev 3: 19, Dev 4: 3).
      #
      # Honest caveat: running these would NOT have caught any of the 17 defects
      # found on 2026-07-29. Those tests are mock-shaped too. This is observability,
      # not verification. See BD-3.
      # GATING, in its own step so a Docker Hub hiccup is attributable rather than
      # being mistaken for a test failure. This is the ONLY verification of the
      # frozen-contract migrations against a real Postgres catalog.
      #
      # `--no-skip-postgres` is enforced by the -rs check below rather than a flag:
      # if psql or the Docker daemon is missing on the runner, these tests skip and
      # the step would otherwise pass green while verifying nothing — binding
      # rule 7's FIXED-UNGUARDED. Asserting a non-zero pass count is what makes the
      # guard real.
      #
      # D51 (2026-08-04): the original guard was `^[0-9]+ skipped|no tests ran`,
      # which only ever matched an ALL-skipped run. pytest's summary for a mixed
      # run reads `9 passed, 12 skipped in 3.20s` — no leading skip count — so a
      # PARTIAL skip passed green and unreported. That is how the PostgREST half of
      # this suite (test_book_select_lists_against_postgrest.py) went un-run in CI
      # while the step reported success: exactly the "something reported success
      # without being checked" pattern the register's Part 1 is about. Any skip in
      # this step now fails it. If a test here must legitimately skip, that is a
      # decision to record, not a default to inherit silently.
      - name: Migration tests (gating, real Postgres)
        run: |
          set -o pipefail
          # `test_migration_chapters_book_scoped.py` drives a LOCAL psql binary over
          # TCP (its `_find_psql`/`pg_server` fixture) and skips without one. Under
          # the D51 guard below, any skip fails this step — so install the client
          # explicitly rather than relying on whatever `ubuntu-latest` happens to
          # ship this month. One apt line is cheaper than the assumption.
          # (The PostgREST harness needs no client: it drives `docker exec psql`
          # inside the container it provisions.)
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql --version
          docker pull pgvector/pgvector:pg16 || docker pull pgvector/pgvector:pg16
          docker pull postgrest/postgrest:v12.2.3 || docker pull postgrest/postgrest:v12.2.3
          pytest tests/integration -q -m postgres -rs | tee /tmp/pg-tests.log
          if grep -qE "no tests ran" /tmp/pg-tests.log; then
            echo "::error::no postgres-marked tests ran — the migration guard did not run"
            exit 1
          fi
          if grep -qE "[0-9]+ skipped" /tmp/pg-tests.log; then
            echo "::error::postgres-marked tests SKIPPED — a skipped guard guards nothing (D51)"
            exit 1
          fi
          if grep -qE "[0-9]+ (xfailed|xpassed|deselected|error)" /tmp/pg-tests.log; then
            echo "::error::postgres-marked tests xfailed/deselected/errored — that is not verification (D51)"
            exit 1
          fi
          # An EXACT count, not a non-zero one. `[0-9]+ passed` still passes green
          # if a whole test FILE is deleted or loses its marker — which is exactly
          # how the PostgREST half of this suite went un-run in the first place.
          # Removing a postgres test must be a deliberate edit to this number.
          EXPECTED_PG_TESTS=76
          if ! grep -qE "\b${EXPECTED_PG_TESTS} passed\b" /tmp/pg-tests.log; then
            echo "::error::expected ${EXPECTED_PG_TESTS} postgres-marked tests to pass; the log disagrees."
            echo "::error::If you added or removed one, update EXPECTED_PG_TESTS in this file deliberately."
            tail -5 /tmp/pg-tests.log
            exit 1
          fi
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
          SUPABASE_JWT_SECRET: test-secret-at-least-32-chars-long!!
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: test
          ELEVENLABS_API_KEY: test
          HEYGEN_API_KEY: test
          LANGFUSE_PUBLIC_KEY: test
          LANGFUSE_SECRET_KEY: test

      - name: Full suite (advisory, not gating)
        continue-on-error: true
        run: pytest tests -q
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
          SUPABASE_JWT_SECRET: test-secret-at-least-32-chars-long!!
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: test
          ELEVENLABS_API_KEY: test
          HEYGEN_API_KEY: test
          LANGFUSE_PUBLIC_KEY: test
          LANGFUSE_SECRET_KEY: test

  web:
    name: Web — lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          # D25: was `apps/web/pnpm-lock.yaml`. This is a pnpm WORKSPACE
          # (pnpm-workspace.yaml lists apps/web) so there is exactly one lockfile
          # and it lives at the repo root. The path never resolved, setup-node
          # failed hard, and the entire web job — lint, type-check, build — has
          # never executed on any commit.
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      # GATING. D/P2: the web job ran install/lint/type-check/build and NEVER ran
      # tests. 41 story lines claimed "full apps/web suite green (488 tests)" and
      # no machine had ever verified any of them. Dev 1 ran it on 2026-07-29:
      # 53 files, 506 passed, 0 failed. It is green, so it gates from day one.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
          # Fixed here (D31, Story 3-35) — previously missing the `/api` suffix
          # that `src/lib/api.ts`'s default carries. Story W0 flagged this as a
          # known trap but deliberately deferred the fix to its named owner
          # (Dev 1); this is that fix landing.
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

  # ── Contract job (Story W0 AC7) ─────────────────────────────────────────────
  # `apps/web` builds its MSW fixtures from docs/contracts/book-api.v1.json. That
  # makes the frontend suite honest about what it believes, but it cannot notice
  # when the BACKEND moves: a renamed field ships green on both sides and the
  # product dies in production. This job is the only thing comparing the frozen
  # contract to the live FastAPI schema.
  contract:
    name: Contract — frozen book-api.v1.json vs live OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: apps/api
        run: uv pip install -e ".[dev]" --system

      # GATING, and built to the same anti-vacuum shape as `Migration tests`
      # above — read D51 there before touching this. The lesson: a guard that can
      # report success without having compared anything is not a guard. So the
      # comparison COUNT is printed by the script and re-checked in the shell;
      # a run that compares zero paths, or fewer schemas than the contract
      # declares, fails the step rather than passing quietly.
      #
      # `--lifespan off` is load-bearing and is NOT a way of dodging a failure:
      # `create_app()` builds every router at import, so the OpenAPI schema is
      # fully determined without startup. The lifespan, by contrast, opens a
      # Redis pool, an ARQ pool and a real Supabase client and asserts real
      # storage buckets exist — none of which CI has, and none of which can
      # change a single path or field in the schema being compared.
      - name: Diff book-scale contract against live /openapi.json
        run: |
          set -o pipefail
          cd apps/api
          uvicorn app.main:app --host 127.0.0.1 --port 8000 --lifespan off &
          UVICORN_PID=$!
          trap 'kill $UVICORN_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/openapi.json -o /tmp/openapi.json; then
              break
            fi
            sleep 1
          done
          if [ ! -s /tmp/openapi.json ]; then
            echo "::error::the API never served /openapi.json — nothing was compared"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"
          python .github/scripts/check_book_contract.py \
            docs/contracts/book-api.v1.json /tmp/openapi.json | tee /tmp/contract.log

          # ── Anti-vacuum re-check, copied from `Migration tests` (D51) ───────
          # The script already exits non-zero on a mismatch. These greps exist
          # for the OTHER failure mode: a script that runs to completion having
          # compared nothing (a renamed contract key, an empty `endpoints`
          # block, an early `return` added by a future edit). A count of zero is
          # a failure, and a MISSING count is a failure too — the D51 bug was a
          # guard whose pattern simply never matched.
          for key in CONTRACT_ENDPOINTS_CHECKED CONTRACT_SCHEMAS_CHECKED CONTRACT_COMPARISONS; do
            if ! grep -qE "^${key}=[0-9]+$" /tmp/contract.log; then
              echo "::error::${key} was never reported — the contract check verified nothing"
              exit 1
            fi
            value=$(grep -E "^${key}=[0-9]+$" /tmp/contract.log | tail -1 | cut -d= -f2)
            if [ "$value" -eq 0 ]; then
              echo "::error::${key}=0 — the contract check ran but compared nothing (D51)"
              exit 1
            fi
          done
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
          SUPABASE_JWT_SECRET: test-secret-at-least-32-chars-long!!
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: test
          ELEVENLABS_API_KEY: test
          HEYGEN_API_KEY: test
          LANGFUSE_PUBLIC_KEY: test
          LANGFUSE_SECRET_KEY: test
