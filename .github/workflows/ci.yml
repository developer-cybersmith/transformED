name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Unit tests
        # D/P1: this was `pytest tests/unit tests/integration -x -q`, which skipped
        # the root tests/ directory entirely — 22 real failures lived there unseen —
        # and `-x` stopped at the first one, so CI never enumerated its own damage.
        # Honest caveat: restoring this would NOT have caught any of the 17 defects
        # found on 2026-07-29. Those tests are mock-shaped too. This restores
        # observability, nothing more. See docs/DEFECT-REGISTER.md BD-3.
        run: pytest tests -q
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
          SUPABASE_JWT_SECRET: test-secret-at-least-32-chars-long!!
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: test
          ELEVENLABS_API_KEY: test
          HEYGEN_API_KEY: test
          LANGFUSE_PUBLIC_KEY: test
          LANGFUSE_SECRET_KEY: test

  web:
    name: Web — lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        # D/P2: the web job ran install/lint/type-check/build and NEVER ran tests.
        # 41 story lines claimed "full apps/web suite green (488 tests)"; no machine
        # had ever verified any of them.
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
          NEXT_PUBLIC_API_URL: http://localhost:8000
