name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      # GATING. Was `... -x -q`; `-x` stopped at the first failure, so CI never
      # enumerated its own damage. These two directories are green today and must
      # stay green.
      # `-m "not postgres"`: the postgres-marked suite replays supabase/migrations/
      # against a real container. It must not sit on the gating path, where an
      # anonymous Docker Hub pull failure or rate-limit would turn main red for a
      # reason unrelated to the change under test. It runs as its own job below.
      - name: Unit tests (gating)
        run: pytest tests/unit tests/integration -q -m "not postgres"
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
          SUPABASE_JWT_SECRET: test-secret-at-least-32-chars-long!!
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: test
          ELEVENLABS_API_KEY: test
          HEYGEN_API_KEY: test
          LANGFUSE_PUBLIC_KEY: test
          LANGFUSE_SECRET_KEY: test

      # ADVISORY — see docs/DEFECT-REGISTER.md D24.
      # D/P1: the gating command above skips the root tests/ directory entirely.
      # 22 real failures live there and have never once been run by CI. This step
      # runs them so the number is visible, but does NOT gate: making it gate today
      # would turn main red for all four developers over failures none of this PR
      # introduced. Trigger to drop `continue-on-error` and fold this into the
      # gating step: the 22 reach zero (Dev 3: 19, Dev 4: 3).
      #
      # Honest caveat: running these would NOT have caught any of the 17 defects
      # found on 2026-07-29. Those tests are mock-shaped too. This is observability,
      # not verification. See BD-3.
      # GATING, in its own step so a Docker Hub hiccup is attributable rather than
      # being mistaken for a test failure. This is the ONLY verification of the
      # frozen-contract migrations against a real Postgres catalog.
      #
      # `--no-skip-postgres` is enforced by the -rs check below rather than a flag:
      # if psql or the Docker daemon is missing on the runner, all of these tests
      # skip and the step would otherwise pass green while verifying nothing —
      # binding rule 7's FIXED-UNGUARDED. Asserting a non-zero pass count is what
      # makes the guard real.
      - name: Migration tests (gating, real Postgres)
        run: |
          set -o pipefail
          docker pull pgvector/pgvector:pg16 || docker pull pgvector/pgvector:pg16
          pytest tests/integration -q -m postgres -rs | tee /tmp/pg-tests.log
          if grep -qE "^[0-9]+ skipped|no tests ran" /tmp/pg-tests.log; then
            echo "::error::postgres-marked tests skipped — the migration guard did not run"
            exit 1
          fi
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
          SUPABASE_JWT_SECRET: test-secret-at-least-32-chars-long!!
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: test
          ELEVENLABS_API_KEY: test
          HEYGEN_API_KEY: test
          LANGFUSE_PUBLIC_KEY: test
          LANGFUSE_SECRET_KEY: test

      - name: Full suite (advisory, not gating)
        continue-on-error: true
        run: pytest tests -q
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
          SUPABASE_JWT_SECRET: test-secret-at-least-32-chars-long!!
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: test
          ELEVENLABS_API_KEY: test
          HEYGEN_API_KEY: test
          LANGFUSE_PUBLIC_KEY: test
          LANGFUSE_SECRET_KEY: test

  web:
    name: Web — lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          # D25: was `apps/web/pnpm-lock.yaml`. This is a pnpm WORKSPACE
          # (pnpm-workspace.yaml lists apps/web) so there is exactly one lockfile
          # and it lives at the repo root. The path never resolved, setup-node
          # failed hard, and the entire web job — lint, type-check, build — has
          # never executed on any commit.
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      # GATING. D/P2: the web job ran install/lint/type-check/build and NEVER ran
      # tests. 41 story lines claimed "full apps/web suite green (488 tests)" and
      # no machine had ever verified any of them. Dev 1 ran it on 2026-07-29:
      # 53 files, 506 passed, 0 failed. It is green, so it gates from day one.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
          NEXT_PUBLIC_API_URL: http://localhost:8000
