name: Deploy

# Runs after CI succeeds on main -- a bare `push` trigger (the old Railway
# version of this file) would deploy code that hasn't passed lint/type-check/
# tests. workflow_dispatch stays as a manual escape hatch (e.g. re-deploying
# after a secrets-only change with no new commit).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy hie-api (API + worker) to Fly.io
    runs-on: ubuntu-latest
    # workflow_dispatch always runs; a CI-triggered run only proceeds if CI
    # actually passed -- a failed/cancelled CI run must never reach deploy.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: deploy-hie-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy the exact commit CI just verified, not whatever main points
          # to when this job happens to start (they can differ if another
          # push landed in between).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Pinned 2026-08-17: "latest" (0.4.83) fails every deploy from this
      # runner with "Error: Authenticate: token validation error" against a
      # deploy-scoped token that works fine locally on 0.4.77 and via a
      # direct `flyctl deploy` from a dev machine -- confirmed a flyctl
      # regression, not a bad token (same token, same secret, only the
      # flyctl version differs between the failing and working case).
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: 0.4.77

      # D150 -- this job never ran Python before this story; matches
      # ci.yml's own "3.12" pin (CLAUDE.md: FastAPI/Python 3.12) rather than
      # whatever ubuntu-latest happens to ship as its default `python3`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # D150 -- verify every secret this app's own startup guards require
      # (RATE_LIMIT_STORAGE_URL / D49, plus every required app.config.Settings
      # field) is actually set on the live Fly app BEFORE attempting to
      # deploy. Closes the gap D146 exposed: D49's guard was correct and
      # fired on every boot attempt, but nothing had verified the deployed
      # environment actually had the secret set, so both machines
      # crash-looped for ~3 hours before anyone noticed. This step fails the
      # job loudly here instead.
      #
      # Deliberately NOT `uv sync --locked` (this job never installed a
      # Python toolchain before this story): apps/api's base dependencies
      # pull in docling (CLAUDE.md's PDF table-markdown stack), which drags
      # in a heavy ML/torch install path -- disproportionate for a script
      # that only needs Settings.model_fields' shape (no instance, no real
      # secret values). Floor pinned to the same version apps/api/pyproject.toml
      # itself declares (`pydantic>=2.7.0`, `pydantic-settings>=2.2.0`).
      # [Review][Patch]: the floor alone had no ceiling, contradicting this
      # comment's own claim -- capped at the next major version so a future
      # pydantic 3.x can't silently change model_fields/is_required()
      # behavior underneath this check without a deliberate version bump here.
      - name: Install minimal deps for the secrets-check script
        run: pip install "pydantic>=2.7.0,<3.0.0" "pydantic-settings>=2.2.0,<3.0.0"

      - name: Verify required Fly secrets are configured (D150)
        run: python scripts/check_fly_secrets_configured.py --app hie-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # fly.toml (repo root) declares app = "hie-api" with both the api and
      # worker process groups -- one deploy covers both (ADR-001 sec3). Run
      # from repo root: the Dockerfile's COPY paths assume that as the build
      # context (2026-08-14 fix, see apps/api/Dockerfile's comment).
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
